name: Tests

# Every push and every pull request. The four offline suites need no network
# and no display; the browser suite does need one and is not run here.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  offline:
    name: Offline suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      # PySide6 links against these even when it never opens a window: the
      # offscreen platform plugin still loads the Qt GUI stack, and without
      # them every Qt-driven test fails at import with a plugin error rather
      # than an assertion.
      - name: Qt's runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libdbus-1-3 libfontconfig1

      - name: Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Engine
        run: python -m tests.test_engine
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Extractors
        run: python -m tests.test_extractors
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Integration
        run: python -m tests.test_integration
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Extension
        run: node tests/test_extension.js
