name: Release

# Builds on all three operating systems and attaches the results to a GitHub
# Release, so nobody has to build this themselves.
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# or run it by hand from the Actions tab, which uploads the artefacts without
# publishing a release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      only:
        description: 'Build one platform, or all of them'
        default: all
        type: choice
        options: [all, linux, macos, windows]

permissions:
  contents: write        # needed to create the release and upload to it

jobs:
  # A tag builds everything. A manual run can build one platform, which matters
  # on a private repository where a macOS minute is billed as ten. The matrix
  # is decided here because a job-level `if:` cannot see the matrix context —
  # filtering there is rejected when the workflow is parsed, not at run time.
  plan:
    name: Decide what to build
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        env:
          ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.only || 'all' }}
        run: |
          all='[
            {"key":"linux","os":"ubuntu-latest","label":"Linux",
             "container":"quay.io/pypa/manylinux_2_34_x86_64",
             "flags":"--with-tests",
             "script":"./packaging/linux/build.sh"},
            {"key":"macos","os":"macos-latest","label":"macOS (Apple silicon)",
             "container":"","flags":"",
             "script":"./packaging/macos/build.sh"},
            {"key":"windows","os":"windows-latest","label":"Windows",
             "container":"","flags":"",
             "script":"packaging\\windows\\build.bat"}
          ]'
          if [ "$ONLY" = "all" ]; then
            picked=$(jq -c . <<<"$all")
          else
            picked=$(jq -c --arg k "$ONLY" '[.[] | select(.key == $k)]' <<<"$all")
          fi
          echo "building: $picked"
          echo "matrix=$picked" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.label }}
    needs: plan
    runs-on: ${{ matrix.os }}
    # PyInstaller bundles the system libraries of the machine it builds on, so
    # the *build* machine decides the oldest Linux this can run on. Built on
    # ubuntu-latest it demanded glibc 2.38, which is newer than Ubuntu 22.04
    # LTS, Debian 12 and RHEL 9 — it installed there and would not start.
    # AlmaLinux 9 holds the floor at 2.34, which is also exactly where
    # PySide6's own wheels sit, so it is as low as this can go without
    # changing Qt. Empty for macOS and Windows, which means no container.
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false     # one platform failing must not hide the other two
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        id: python
        if: matrix.container == ''
        with:
          python-version: '3.14'

      # Every later step reads IXD_PYTHON rather than a step output, because
      # the two ways of getting an interpreter now differ per platform.
      - name: The interpreter to build with
        if: matrix.container == ''
        shell: bash
        run: echo "IXD_PYTHON=${{ steps.python.outputs.python-path }}" >> "$GITHUB_ENV"

      # The image carries several CPythons under /opt/python, and being present
      # is not enough: manylinux builds them *without* --enable-shared, and
      # PyInstaller refuses those outright —
      #
      #   ERROR: Python was built without a shared library, which is required
      #
      # which is what the first run in this container died of. So each
      # candidate is asked whether it has a shared libpython, the newest one
      # that does wins, and every rejection is printed. A build that quietly
      # fell back to an older interpreter is not something to learn from a bug
      # report.
      - name: The interpreter to build with (container)
        if: matrix.container != ''
        run: |
          set -uo pipefail
          shared() {
            "$1" -c 'import sysconfig, sys; sys.exit(
                0 if sysconfig.get_config_var("Py_ENABLE_SHARED") else 1)' \
              2>/dev/null
          }
          echo "what this image offers:"
          ls -1 /opt/python 2>/dev/null || echo "  (no /opt/python)"
          pick=""
          for candidate in /opt/python/cp314-cp314/bin/python3 \
                           /opt/python/cp313-cp313/bin/python3 \
                           /opt/python/cp312-cp312/bin/python3 \
                           /opt/python/cp311-cp311/bin/python3 \
                           /usr/bin/python3.14 /usr/bin/python3.13 \
                           /usr/bin/python3.12 /usr/bin/python3.11 \
                           python3.14 python3.13 python3.12 python3.11; do
            resolved="$(command -v "$candidate" 2>/dev/null || true)"
            if [ -z "$resolved" ]; then
              echo "  absent          $candidate"
              continue
            fi
            if shared "$resolved"; then
              echo "  USING           $resolved ($("$resolved" --version 2>&1))"
              pick="$resolved"
              break
            fi
            echo "  static libpython, PyInstaller cannot use it: $resolved"
          done
          if [ -z "$pick" ]; then
            echo "nothing here has a shared libpython; installing one"
            dnf install -y python3.12 python3.12-devel python3.12-pip
            # Named absolutely on purpose: the image's own static python3.12
            # sits in /usr/local/bin, which comes first on PATH, so
            # `command -v` hands back the one that was just rejected.
            pick="/usr/bin/python3.12"
            if [ -z "$pick" ] || ! shared "$pick"; then
              echo "the installed interpreter is static too; this image cannot"
              echo "build a PyInstaller binary."
              exit 1
            fi
            echo "  USING           $pick ($("$pick" --version 2>&1))"
          fi
          echo "IXD_PYTHON=$pick" >> "$GITHUB_ENV"

      # Qt has to be importable for PyInstaller to analyse it, and whatever is
      # installed here is what PyInstaller can bundle — anything missing ends
      # up declared as a dependency of the .deb instead, which is correct but
      # is one more thing the user's machine has to have. The second list is
      # tried a package at a time and each outcome is printed: a package that
      # quietly did not install is how the TIFF plugin came to ship broken.
      - name: Qt's runtime libraries (container)
        if: matrix.container != ''
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            mesa-libGL mesa-libEGL libdrm libX11 libX11-xcb libxcb \
            libxkbcommon libxkbcommon-x11 fontconfig freetype dbus-libs \
            zlib openssl-libs
          for optional in xcb-util xcb-util-image xcb-util-keysyms \
                          xcb-util-renderutil xcb-util-wm xcb-util-cursor \
                          libXext libXrender libXi libXfixes libXrandr \
                          libXcursor libXcomposite libXdamage libXinerama \
                          libXtst mesa-libgbm libwayland-client \
                          libwayland-cursor libwayland-egl libwayland-server \
                          libtiff libjpeg-turbo libwebp; do
            if dnf install -y --setopt=install_weak_deps=False "$optional" \
                 >/dev/null 2>&1; then
              echo "  installed     $optional"
            else
              echo "  NOT available $optional — it will be declared as a "\
                   "dependency instead"
            fi
          done

      # AppImage is the answer to "will it run on my distribution", and this
      # project has never published one: the AppDir was assembled, the tool was
      # never installed, and the job stayed green. It is fetched *before* the
      # build so that the ordinary --package run produces it, and the asset is
      # checked for afterwards.
      - name: appimagetool
        if: runner.os == 'Linux'
        run: |
          curl -sSL --retry 3 -o /tmp/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool
          echo "IXD_APPIMAGETOOL=/tmp/appimagetool" >> "$GITHUB_ENV"
          ls -lh /tmp/appimagetool

      # The same scripts a user runs, so they are exercised on every release
      # rather than only when somebody reports that one is broken. `IXD_PYTHON`
      # pins the interpreter set up above instead of leaving the script to
      # search a runner image that has several.
      # --with-tests on Linux: the container settles on whichever interpreter
      # has a shared libpython, which may not be the 3.14 this is developed on.
      # The offline suites run against it before anything is built, so a
      # version difference is caught here rather than by a user.
      - name: Build (Unix)
        if: runner.os != 'Windows'
        run: ${{ matrix.script }} --no-install ${{ matrix.flags }}

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: ${{ matrix.script }}
        env:
          CI: 'true'          # the script skips its final `pause` when set

      # NSIS ships on the runner image but is not on PATH, so `build.py` wrote
      # the script and skipped compiling it — v1.0.14 published a release note
      # promising an installer and no installer. Found where it is, or installed
      # if the image ever stops carrying it, and **both outcomes are logged**:
      # a step that silently produces nothing is how this got out.
      - name: Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $nsis = "C:\Program Files (x86)\NSIS"
          if (Test-Path "$nsis\makensis.exe") {
            Write-Host "makensis: already on the image at $nsis"
          } else {
            Write-Host "makensis: not on the image, installing"
            choco install nsis -y --no-progress
          }
          if (-not (Test-Path "$nsis\makensis.exe")) {
            throw "makensis is still not present; the installer cannot be built"
          }
          "$nsis" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:PATH = "$nsis;$env:PATH"
          & "$env:IXD_PYTHON" packaging/build.py --installer --no-clean
          $setup = Get-ChildItem dist\*setup.exe -ErrorAction SilentlyContinue
          if (-not $setup) { throw "no setup.exe was produced" }
          Write-Host "installer: $($setup.Name) $([math]::Round($setup.Length/1MB,1)) MB"

      # A folder of files is not something to hand somebody. Each platform's
      # portable build is collapsed into one archive next to its installer.
      #
      # Two of them, and the difference is one file. The `-selfupdate` archive
      # carries `update-channel.json`, which is the only thing that lets a
      # build replace its own folder — written at build time on purpose, so an
      # unpacked `.deb` in /opt can never be mistaken for a portable copy. The
      # ordinary archives keep behaving exactly as they always have.
      - name: Portable archive (Linux)
        if: runner.os == 'Linux'
        run: tar -C dist -czf dist/ixd-linux-x86_64.tar.gz ixd

      - name: Portable archive (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist
          if [ -d "Internet Xtreme Downloader.app" ]; then
            ditto -c -k --keepParent "Internet Xtreme Downloader.app" ixd-macos-arm64.zip
          else
            tar -czf ixd-macos-arm64.tar.gz ixd
          fi

      - name: Self-updating archive
        shell: bash
        run: |
          "${IXD_PYTHON:-python3}" packaging/build.py --self-update --no-clean
        continue-on-error: true

      # The floor is asserted, not merely printed. This is the one number that
      # decides whether the package can start on the distributions it installs
      # on, it is invisible from the outside, and it moves whenever the build
      # image changes underneath us — so the build fails rather than quietly
      # shipping something Ubuntu 22.04 cannot run. The .AppImage is checked
      # for in the same breath: for five releases it was skipped in silence.
      - name: The oldest Linux this will run on
        if: runner.os == 'Linux'
        run: |
          # Explicit, not inherited: a runner's default shell happens to be
          # `bash -e`, and this check reported its own failure and exited 0
          # under a plain `bash` — green, with the message right there.
          set -euo pipefail
          "$IXD_PYTHON" - <<'CHECK'
          import sys
          sys.path.insert(0, "packaging")
          from pathlib import Path
          import build

          required, recommended, floor, unmapped = build.dependency_survey(
              Path("dist/ixd"))
          reads = ".".join(str(part) for part in floor)
          print(f"glibc floor : {reads}")
          print(f"Depends     : {', '.join(required)}")
          print(f"Recommends  : {', '.join(recommended) or '(none)'}")
          for soname in unmapped:
              print(f"! no package is mapped to {soname}")
          if floor > (2, 34):
              raise SystemExit(
                  f"this build needs glibc {reads}. The floor must stay at "
                  f"2.34 or the package will not start on Ubuntu 22.04, "
                  f"Debian 12 or RHEL 9 — check the build container.")
          print("ok — runs on glibc 2.34 and newer")
          CHECK
          appimage=$(ls -1 dist/*.AppImage 2>/dev/null | head -1)
          if [ -z "$appimage" ]; then
            echo "no .AppImage was produced"; exit 1
          fi
          echo "AppImage    : $(basename "$appimage")"

      - name: What was produced
        shell: bash
        run: ls -lh dist/ || dir dist

      # A build that failed on one platform is the whole reason to keep the
      # log, so it is kept exactly then.
      - name: Keep the build log
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: build-log-${{ runner.os }}
          if-no-files-found: ignore
          path: build-*.log

      - uses: actions/upload-artifact@v5
        with:
          name: ixd-${{ runner.os }}
          if-no-files-found: error
          path: |
            dist/*.deb
            dist/*.dmg
            dist/*.zip
            dist/*.tar.gz
            dist/*.AppImage
            dist/*setup.exe
            dist/*.pkg

  publish:
    name: Publish the release
    needs: [plan, build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v6
        with:
          path: artifacts

      # The extension zips and the source bundle are produced by all three
      # builds, so the same name arrives three times; the first copy wins and
      # the rest are skipped rather than overwriting it.
      - name: Collect
        run: |
          mkdir -p release
          find artifacts -type f -exec cp -n {} release/ \;
          ls -lh release

      # `gh` is on the runner already, so the release is cut without a
      # third-party action — the same reasoning as the rest of this project.
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # What this release fixed, if anything was written down for it.
          #
          # It goes in the file rather than being pasted onto the page
          # afterwards, because the branch below *replaces* the notes whenever
          # a release is re-run — so a hand-edited page would be silently
          # reverted by the next rebuild of the same tag.
          : > notes.md
          written="packaging/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$written" ]; then
            cat "$written" >> notes.md
            printf '\n---\n\n' >> notes.md
          fi
          cat >> notes.md <<'NOTES'
          > **This is a beta.** If something does not work, please open an
          > issue — the templates ask for the log, which is usually the whole
          > answer. Toolbar → **Log** → **Copy**.

          ## Downloads

          Every platform has both: an **installer**, and a **portable** copy
          that keeps its files wherever you put them and can replace itself
          in place.

          | Platform | Installer | Portable |
          |---|---|---|
          | Windows | `ixd-*-windows-x64-setup.exe` | `ixd-*-windows-x64.zip` |
          | macOS (Apple silicon) | `ixd-*-macos-arm64.pkg`, or the `.dmg` | `ixd-macos-arm64.zip` |
          | Linux | `ixd_*_amd64.deb` | `ixd-linux-x86_64.tar.gz` |

          The Windows installer asks whether to install **for everyone** — which
          needs administrator and goes to `Program Files` — or **just for you**,
          which needs nothing and goes to `%APPDATA%\IXD`.

          The `*-selfupdate*` archives are the portable copies that are allowed
          to replace their own folder when a new version appears. The ordinary
          ones never touch themselves.

          Start the application once, then load the extension from the folder
          it writes. The two browsers need different manifests under the same
          filename, so they get a folder each.

          | | Chrome / Edge / Brave | Firefox |
          |---|---|---|
          | Linux | `~/.local/share/ixd/extension` | `~/.local/share/ixd/extension-firefox` |
          | Windows | `%APPDATA%\IXD\extension` | `%APPDATA%\IXD\extension-firefox` |
          | macOS | `~/Library/Application Support/IXD/extension` | `…/extension-firefox` |

          Chrome: `chrome://extensions` → Developer mode → **Load unpacked** →
          the folder. Firefox: `about:debugging` → **Load Temporary Add-on** →
          `manifest.json` inside the folder.

          ### Before you report a problem

          **macOS is unverified.** It builds and packages on a macOS runner and
          has never been launched on real hardware. A report either way is
          genuinely useful — including "it just worked". It is also neither
          signed nor notarised, so the first launch needs right-click → **Open**,
          or `xattr -dr com.apple.quarantine "Internet Xtreme Downloader.app"`.

          **Windows: the first launch takes a while.** Windows scans the whole
          folder before it runs anything from it. Later launches are immediate.

          **Linux** is the platform this is developed on and gets the most use.
          NOTES
          # Which commit these binaries actually are. A tag left
          # behind while work continued publishes a green build of
          # stale code, and nothing on the page said so.
          printf '\nBuilt from `%s` on %s.\n' \
            "${GITHUB_SHA:0:7}" "$(date -u +%Y-%m-%d)" >> notes.md
          # Converge rather than fail. Re-running a release — because one
          # platform needed fixing, or the tag was moved — met "a release with
          # the same tag name already exists" and stopped, leaving the release
          # holding the *previous* build's binaries with no sign that anything
          # was wrong. Whichever way round it is, the assets end up matching
          # the code the tag points at.
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "the release exists; replacing its assets and notes"
            gh release upload "${GITHUB_REF_NAME}" release/* --clobber
            gh release edit "${GITHUB_REF_NAME}" \
              --title "IXD ${GITHUB_REF_NAME}" \
              --notes-file notes.md
          else
            gh release create "${GITHUB_REF_NAME}" release/* \
              --title "IXD ${GITHUB_REF_NAME}" \
              --notes-file notes.md
          fi
